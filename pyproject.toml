[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annz-rebuilt"
version = "0.1.0"
description = "Chunked Python rebuild of the ANNz+ photometric-redshift workflow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "torch>=2.4,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
